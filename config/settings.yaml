# ==========================================
# Trend-Bot Configuration (18-Year Optimized)
# ==========================================

# 1. Watchlist
watchlist:
  - AAPL
  - MSFT
  - NVDA
  - LLY
  - TSLA
  - AMD
  - META
  - GOOGL
  - AMZN
  - JPM
  - V
  - WMT
  - JNJ
  - PG
  - XOM
  - HD
  - CVX
  - MRK
  - ABBV
  - PEP
  - KO
  - COST
  - AVGO
  - ADBE
  - CRM
  - NFLX
  - CSCO
  - INTC
  - QCOM
  - TXN
  - BTC/USD
  - ETH/USD

# 2. Trend Detection Parameters
trend:
  sma_short: 20        
  sma_long: 50         
  adx_period: 14       
  adx_threshold: 28    # 18-Year Optimized
  rel_strength_days: 20 

# 3. Entry Signals
signals:
  pullback:
    rsi_period: 14
    rsi_threshold: 58  # 18-Year Optimized
    support_proximity: 0.04 # 18-Year Optimized (4%)
  breakout:
    lookback_period: 20 
    volume_multiplier: 1.5
  z_score:             
    period: 20
    threshold: -3.0      

# 4. News Judge Agent
news:
  lookback_hours: 24   
  veto_on_material: true 
  trusted_sources:     
    - "Reuters"
    - "Bloomberg"
    - "SEC"
    - "Wall Street Journal"

# 5. Risk Management
risk:
  max_position_pct: 0.05 
  stop_loss_pct: 0.05   # 18-Year Optimized (5%)
  take_profit_pct: 0.06  
  max_open_positions: 3  
  circuit_breaker:
    enabled: true
    min_equity: 400.0
    liquidate_on_trigger: true
    state_file: "data/bot_state.json"

# 6. Execution & System
system:
  mode: "paper"         # Change from signal_only to paper, so it actually trades
  poll_interval_minutes: 5 
  log_level: "INFO"